<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Free AI</title>
<style>
  body { font-family: system-ui, sans-serif; background:#0f1115; color:#e8e8e8; margin:0; display:flex; flex-direction:column; height:100vh; }
  header { padding:14px 18px; background:#171a21; font-weight:600; }
  #status { font-size:12px; font-weight:400; color:#8a93a6; margin-top:4px; }
  #chat { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:12px; }
  .msg { max-width:80%; padding:10px 14px; border-radius:12px; white-space:pre-wrap; line-height:1.4; }
  .user { align-self:flex-end; background:#3b6cf6; }
  .ai { align-self:flex-start; background:#222733; }
  form { display:flex; gap:8px; padding:12px; background:#171a21; }
  input { flex:1; padding:12px; border-radius:8px; border:none; background:#222733; color:#fff; font-size:16px; }
  button { padding:12px 18px; border:none; border-radius:8px; background:#3b6cf6; color:#fff; font-size:16px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
</style>
</head>
<body>
<header>My Free AI <div id="status">Loading model...</div></header>
<div id="chat"></div>
<form id="form">
  <input id="input" placeholder="Type a message..." autocomplete="off" disabled>
  <button id="send" disabled>Send</button>
</form>

<script type="module">
import * as webllm from "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.79/+esm";

const MODEL = "Llama-3.2-1B-Instruct-q4f16_1-MLC";
const chat = document.getElementById("chat");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const status = document.getElementById("status");

const history = [{ role: "system", content: "You are a helpful, friendly assistant." }];

function addMsg(text, who) {
  const div = document.createElement("div");
  div.className = "msg " + who;
  div.textContent = text;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

if (!navigator.gpu) {
  status.textContent = "Your browser doesn't support WebGPU. Try desktop Chrome or Edge.";
} else {
  try {
    const engine = await webllm.CreateMLCEngine(MODEL, {
      initProgressCallback: (p) => { status.textContent = p.text; }
    });
    status.textContent = "Ready";
    input.disabled = false;
    send.disabled = false;
    input.focus();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      input.value = "";
      send.disabled = true;
      addMsg(text, "user");
      history.push({ role: "user", content: text });

      const bubble = addMsg("...", "ai");
      let full = "";
      const stream = await engine.chat.completions.create({ messages: history, stream: true });
      for await (const chunk of stream) {
        full += chunk.choices[0]?.delta?.content || "";
        bubble.textContent = full;
        chat.scrollTop = chat.scrollHeight;
      }
      history.push({ role: "assistant", content: full });
      send.disabled = false;
    });
  } catch (err) {
    status.textContent = "Error: " + err.message;
  }
}
</script>
</body>
</html>
